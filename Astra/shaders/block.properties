block.10027=minecraft:calibrated_sculk_sensor minecraft:medium_amethyst_bud minecraft:large_amethyst_bud minecraft:amethyst_cluster minecraft:pearlescent_froglight minecraft:end_rod minecraft:nether_portal minecraft:crying_obsidian minecraft:respawn_anchor minecraft:sculk_catalyst

