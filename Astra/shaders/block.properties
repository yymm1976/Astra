# ============================================================
# Astra v1 - block.properties
# Base tables ported from Mellow Shader v3.4 (MIT, by TheCMK) - see THIRD-PARTY.md.
# ID allocation (mc_Entity.x) - E1 maps these into the 4-bit packed material ID:
#   10001 water
#   10002 waving foliage, full blocks (leaves, vines) - also SSS-eligible
#   10003 plants with no directional lighting (water/nether plants, cobweb...)
#   10004 waving small plants (1 block tall or less) - also SSS-eligible
#   10005/10006 waving double plants (lower/upper half)
#   10007 end portal/gateway starry effect
#   10010 shadow-transparent glass (does NOT cast shadows; design.md 4.1)
#   10011 ice (SSR-eligible top faces; design.md 4.3)
#   10012 end stone (restrained rough specular; E3 reuses the same 4-bit field)
#   10013..10016 emitter-driven gloss rock classes (E3 2026-09-22); packed as
#                material 12..15, which are the last four free values of the field
#   10021..10027 emissive blocks by light color (R/O/Y/L/T/B/P)
# Version coverage: 1.21.x incl. 1.21.4/1.21.5 content (pale garden, dry grass,
# copper torch...). 26.x-only blocks, if any, are added after the D1 smoke test.
# ============================================================

