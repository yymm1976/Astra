# ============================================================
# Astra v1 - block.properties
# Base tables ported from Mellow Shader v3.4 (MIT, by TheCMK) - see THIRD-PARTY.md.
# ID allocation (mc_Entity.x) - E1 maps these into the 4-bit packed material ID:
#   10001 water
#   10002 waving foliage, full leaf blocks - also SSS-eligible
#   10003 non-waving plants and cobwebs; share the foliage lighting group
#   10004 waving small plants (1 block tall or less) - also SSS-eligible
#   10005/10006 waving double plants (lower/upper half)
#   10007 end portal/gateway starry effect
#   10010 shadow-transparent glass (does NOT cast shadows; design.md 4.1)
#   10011 ice (SSR-eligible top faces; design.md 4.3)
#   10012 end stone (restrained rough specular; E3 reuses the same 4-bit field)
#   10013..10016 rock reflection classes (E3 2026-09-22; the old emitter-driven
#                emission branch was removed 2026-10-02); packed as material 12..15,
#                which are the last four free values of the field
#   10019 thin waving vines/moss: lighting class 2, nether voxel non-solid
#   10021..10027 partial-shape emitters by light color (red/orange/lime/turquoise/
#                blue/purple; the yellow group is 10036 below)
#   10028..10030 fire / soul fire / lava (separate nether voxel species)
#   10031/10032 wet wood / soil families; lighting material stays 0,
#               independent wet class travels in faceData bits 23..24
#   10033 non-emitting torch/campfire shapes; lighting material 0, voxel non-solid
#   10034..10040 opaque emitters by light color; same surface emission, voxel solid
# Version coverage: 1.21.x incl. 1.21.4/1.21.5 content (pale garden, dry grass,
# copper torch...). 26.x-only blocks, if any, are added after the D1 smoke test.
# ============================================================

# Blocks that are water or behave like water
