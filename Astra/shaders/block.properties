block.10011=minecraft:ice minecraft:packed_ice minecraft:blue_ice minecraft:frosted_ice

# ------------------------------------------------------------
# Emitter-driven gloss rock (E3 2026-09-22). User request: "给部分方块加反射/泛光；
# 下界岩加了之后可以反射出岩浆和火焰的光芒." These classes get a per-texel gloss whose
# brightness follows the fragment's own vanilla BLOCK LIGHT level, so a block next to
# lava / fire / a torch picks up a warm reflection while a block far from any emitter
# is bit-for-bit unchanged (see program/lit.fsh, branch `material >= 12u`).
# IDEA ONLY from Complementary r5.9, whose per-terrain-material smoothness tables
# (lib/materials/specificMaterials/terrain/*.glsl) are what its SSR mirrors emitters
# with; Complementary's licence is proprietary (THIRD-PARTY.md), so no expression from
# it is used here - the gloss form, the grain and the falloff are Astra's own.
# Class split follows what the user can see: netherrack is the reported case, blackstone
# /basalt is the other glossy volcanic rock, deepslate is the deep-stone family, and the
# stone family is the overworld rock that torch light lands on.
# Every id below was checked against this instance's vanilla block registry
# (assets/minecraft/lang/en_us.json in the client jar), not only against the reference
# pack corpus the way check_pack.py item 7 does.
# ------------------------------------------------------------
# Netherrack: the reported case. Dark red volcanic rock, strongest warm response.
block.10013=minecraft:netherrack
# Blackstone / basalt family: darker and glossier than netherrack.
block.10014=minecraft:blackstone minecraft:polished_blackstone minecraft:polished_blackstone_bricks minecraft:chiseled_polished_blackstone minecraft:cracked_polished_blackstone_bricks minecraft:gilded_blackstone minecraft:basalt minecraft:polished_basalt minecraft:smooth_basalt
# Deepslate family, including every vanilla stonecutter variant.
block.10015=minecraft:deepslate minecraft:cobbled_deepslate minecraft:polished_deepslate minecraft:deepslate_bricks minecraft:cracked_deepslate_bricks minecraft:deepslate_tiles minecraft:cracked_deepslate_tiles minecraft:chiseled_deepslate minecraft:reinforced_deepslate
# Overworld stone family: the rock torch/campfire light lands on.
block.10016=minecraft:stone minecraft:cobblestone minecraft:mossy_cobblestone minecraft:stone_bricks minecraft:mossy_stone_bricks minecraft:cracked_stone_bricks minecraft:chiseled_stone_bricks minecraft:smooth_stone minecraft:granite minecraft:polished_granite minecraft:diorite minecraft:polished_diorite minecraft:andesite minecraft:polished_andesite minecraft:tuff minecraft:polished_tuff minecraft:tuff_bricks minecraft:chiseled_tuff minecraft:chiseled_tuff_bricks minecraft:calcite

# Light emitting blocks, grouped by light color (emissive boost + colored blocklight)
# Filter redstone lights, campfires and berry vines by their emitting state.
# Unlit redstone_torch / campfire / soul_campfire (lit=false) hit no row here -> mc_Entity=0 and shadow.vsh:64-66 leaves their voxel cell solid: in the Nether volume they occlude light, contrary to the "torches are not full cubes" note at shadow.vsh:65.
# Kept deliberately; changing this needs the lit.vsh material mapping designed together, not a row patched here in isolation.
# Red
block.10021=minecraft:redstone_torch:lit=true minecraft:redstone_wall_torch:lit=true minecraft:redstone_ore:lit=true minecraft:deepslate_redstone_ore:lit=true
# Orange
block.10022=minecraft:wall_torch minecraft:jack_o_lantern minecraft:cave_vines:berries=true minecraft:cave_vines_plant:berries=true minecraft:campfire:lit=true minecraft:magma_block minecraft:torch minecraft:lantern minecraft:shroomlight
# Yellow
block.10023=minecraft:redstone_lamp:lit=true minecraft:glowstone minecraft:ochre_froglight
# Lime
block.10024=minecraft:copper_torch minecraft:copper_wall_torch minecraft:verdant_froglight minecraft:sea_pickle minecraft:ender_chest
# Turquoise
block.10025=minecraft:sea_lantern minecraft:sculk_sensor minecraft:enchanting_table minecraft:glow_lichen minecraft:conduit
# Blue
block.10026=minecraft:soul_torch minecraft:soul_wall_torch minecraft:soul_campfire:lit=true minecraft:soul_lantern minecraft:beacon minecraft:trial_spawner minecraft:vault
