# ------------------------------------------------------------
# Profiles: explicit quality configuration; independent colour controls are omitted.
# Raw quality defaults = BALANCED.
#
# Tiering rule (survey docs/2026-09-20 6 P0-1): PERFORMANCE <= BALANCED <= ULTRA in
# measured cost, and every token that differs between tiers must change cost or select a
# richer implementation - SSS_FOLIAGE / WATER_CAUSTICS / AIR_PERSPECTIVE / WAVING_FOLIAGE
# / UNDERWATER_SHAFT_SAMPLES / SKY_MODE / SUN_MOON_MODE each guard real work (see
# qa/tools/inspect_iris_properties.py for the resolved per-tier pass and buffer sets).
# Differing a token purely to make the tiers look different is the RedHat failure mode
# the survey cites: a non-monotone ladder that is decoupled from cost.
# BALANCED matches the raw quality defaults in lib/settings.glsl.
# ------------------------------------------------------------
