variable.float.astraWaterPaletteNightB=if(1.0 <= 0.04045, 1.0 / 12.92, pow((1.0 + 0.055) / 1.055, 2.2)) * 0.3
variable.float.astraWaterTerrainIntensity=mix(mix(1.69, 2.25, astraWaterPaletteRootTime), 2.25, astraWaterPaletteTime)
