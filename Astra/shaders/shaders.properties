uniform.float.astraDawnBlend=if(worldTime < 12000, 1.0, 0.0)

# Actual shadow-light direction, normalized after the same world-space transform
# as view_player(lightVector). Keep the real source handoff around dusk/dawn.
variable.float.astraLightWorldX=gbufferModelViewInverse.x.0 * lightVector.x + gbufferModelViewInverse.y.0 * lightVector.y + gbufferModelViewInverse.z.0 * lightVector.z
variable.float.astraLightWorldY=gbufferModelViewInverse.x.1 * lightVector.x + gbufferModelViewInverse.y.1 * lightVector.y + gbufferModelViewInverse.z.1 * lightVector.z
variable.float.astraLightWorldZ=gbufferModelViewInverse.x.2 * lightVector.x + gbufferModelViewInverse.y.2 * lightVector.y + gbufferModelViewInverse.z.2 * lightVector.z
variable.float.astraLightNorm=1.0 / max(sqrt(astraLightWorldX * astraLightWorldX + astraLightWorldY * astraLightWorldY + astraLightWorldZ * astraLightWorldZ), 0.000001)
variable.float.astraLightY=astraLightWorldY * astraLightNorm
uniform.float.astraSunSource=if(astraLightWorldX * worldSunVector.x + astraLightWorldY * worldSunVector.y + astraLightWorldZ * worldSunVector.z >= 0.0, 1.0, 0.0)
variable.float.astraMoonHorizonT=clamp((astraLightY - 0.08) / 0.32, 0.0, 1.0)
variable.float.astraSunHorizonT=clamp(astraLightY / 0.085, 0.0, 1.0)
variable.float.astraSunHeightT=clamp((astraLightY - 0.12) / 0.28, 0.0, 1.0)
variable.float.astraMoonHorizon=astraMoonHorizonT * astraMoonHorizonT * (3.0 - 2.0 * astraMoonHorizonT)
variable.float.astraSunHorizon=astraSunHorizonT * astraSunHorizonT * (3.0 - 2.0 * astraSunHorizonT) * mix(0.82, 1.0, astraSunHeightT * astraSunHeightT * (3.0 - 2.0 * astraSunHeightT))
uniform.float.astraDirectLightGate=mix(astraMoonHorizon, astraSunHorizon, astraSunSource) * mix(1.0, 0.22, astraRainFactor)

# --- Steadfast-inspired frame-wide sky scheduling (Astra expressions) ---
# Existing Complementary-derived gradient curves are evaluated here; direction
# dependent scattering/glare and texture noise remain on the GPU.
variable.float.astraSunLengthInv=1.0 / max(sqrt(worldSunVector.x * worldSunVector.x + worldSunVector.y * worldSunVector.y + worldSunVector.z * worldSunVector.z), 0.000001)
uniform.vec3.astraSunDirection=vec3(worldSunVector.x * astraSunLengthInv, worldSunVector.y * astraSunLengthInv, worldSunVector.z * astraSunLengthInv)
uniform.vec3.astraWorldLightDirection=vec3(astraLightWorldX * astraLightNorm, astraLightWorldY * astraLightNorm, astraLightWorldZ * astraLightNorm)
# Fixed orbit axis for the existing tilted sun path. Cross(axis, sun) gives
# a continuous tangent through both noon and midnight; no shadow-source flip.
variable.float.astraStarTiltSin=sin(sunPathRotation * 0.017453292519943295)
variable.float.astraStarTiltCos=cos(sunPathRotation * 0.017453292519943295)
variable.float.astraStarTangentX=astraStarTiltSin * astraSunDirection.z - astraStarTiltCos * astraSunDirection.y
variable.float.astraStarTangentY=astraStarTiltCos * astraSunDirection.x
variable.float.astraStarTangentZ=-astraStarTiltSin * astraSunDirection.x
variable.float.astraStarTangentInv=1.0 / max(sqrt(astraStarTangentX * astraStarTangentX + astraStarTangentY * astraStarTangentY + astraStarTangentZ * astraStarTangentZ), 0.000001)
uniform.vec3.astraStarTangent=vec3(astraStarTangentX * astraStarTangentInv, astraStarTangentY * astraStarTangentInv, astraStarTangentZ * astraStarTangentInv)
uniform.vec3.astraStarAxis=vec3(0.0, astraStarTiltSin, astraStarTiltCos)
uniform.vec2.astraStarTwinkle=vec2(cos(frameTimeCounter * 1.1), sin(frameTimeCounter * 1.1))
variable.float.astraGradientSun=if(worldSunVector.y < 0.0, clamp(worldSunVector.y + 0.375, 0.0, 0.75) / 0.75, clamp(worldSunVector.y + 0.03125, 0.0, 0.0625) / 0.0625)
variable.float.astraGradientVisibility=clamp(worldSunVector.y + 0.0625, 0.0, 0.125) / 0.125
variable.float.astraGradientVisibility2=astraGradientVisibility * astraGradientVisibility
variable.float.astraGradientNoon=sqrt(clamp(worldSunVector.y / cos(sunPathRotation * 0.017453292519943295), 0.0, 1.0))
variable.float.astraGradientNoonT=clamp((worldSunVector.y - 0.070) / 0.172, 0.0, 1.0)
variable.float.astraGradientInvNoon=min(1.0 - astraGradientNoon, 1.0 - astraGradientNoonT * astraGradientNoonT * (3.0 - 2.0 * astraGradientNoonT))
variable.float.astraGradientInvNoon2=astraGradientInvNoon * astraGradientInvNoon
variable.float.astraGradientShadowBase=abs(astraGradientVisibility - 0.5) * 2.0
variable.float.astraGradientNightCurve=1.0 - pow(skyVisibilityDay, 4.0)
variable.float.astraGradientNightLobe=(1.0 - pow(1.0 - astraGradientNightCurve, 4.0)) * 0.4
uniform.vec4.astraSkyFactorsSun=vec4(astraGradientSun, astraGradientVisibility, astraGradientVisibility2, astraGradientNoon)
uniform.vec4.astraSkyFactorsTime=vec4(astraGradientInvNoon, astraGradientInvNoon2, 1.0 - skyVisibilityDay, pow(astraGradientShadowBase, 4.0))
uniform.vec4.astraSkyFactorsWeather=vec4(astraRainFactor * astraRainFactor, 1.0 - astraRainFactor, astraGradientNightCurve, astraGradientNightLobe)
uniform.float.astraStarVisibility=(1.0 - astraRainFactor) * pow(astraGradientInvNoon2, 4.0) * (1.0 - 0.5 * astraGradientVisibility)
# Cloud clear-day palette is view-independent. Preserve the existing powers and
# interpolation order; weather, screen brightness and artistic tint stay in GLSL.
uniform.vec3.astraCloudDayLight=vec3( \
    mix(pow(0.64, 1.5 + astraGradientInvNoon) * 5.0, 0.65 * 2.05, 1.0 - astraGradientInvNoon), \
    mix(pow(0.45, 1.5 + astraGradientInvNoon) * 5.0, 0.55 * 2.05, 1.0 - astraGradientInvNoon), \
    mix(pow(0.3, 1.5 + astraGradientInvNoon) * 5.0, 0.375 * 2.05, 1.0 - astraGradientInvNoon))
uniform.vec3.astraCloudDayAmbient=vec3( \
    mix(astraCloudNoonAmbient.x * 1.21 * 0.95, astraCloudNoonAmbient.x, 1.0 - astraGradientInvNoon), \
    mix(astraCloudNoonAmbient.y * 0.92 * 0.95, astraCloudNoonAmbient.y, 1.0 - astraGradientInvNoon), \
    mix(astraCloudNoonAmbient.z * 0.76 * 0.95, astraCloudNoonAmbient.z, 1.0 - astraGradientInvNoon))
variable.vec3.astraGradientColor2=vec3(mix(max(max(skyColor.r, 0.0), astraGradientSun * 0.265), max(skyColor.r, 0.0), astraSkyDrySquared), mix(max(max(skyColor.g, 0.0), astraGradientSun * 0.295), max(skyColor.g, 0.0), astraSkyDrySquared), mix(max(max(skyColor.b, 0.0), astraGradientSun * 0.35), max(skyColor.b, 0.0), astraSkyDrySquared))
variable.vec3.astraGradientNoonUp=vec3(astraSkyNoonBase.x * (0.85 + astraRainFactor * 0.1), astraSkyNoonBase.y * (0.92 + astraRainFactor * 0), astraSkyNoonBase.z * (0.81 + astraRainFactor * 0.1))
variable.vec3.astraGradientNoonMiddle=vec3(astraSkyColorM.x * (1.4 + astraRainFactor * (-0.1 + 0 * astraGradientNoon)) + astraGradientNoonUp.x * 0.25, astraSkyColorM.y * (1.3 + astraRainFactor * (-0.4 + 0.06 * astraGradientNoon)) + astraGradientNoonUp.y * 0.25, astraSkyColorM.z * (1.3 + astraRainFactor * (-0.6 + 0.12 * astraGradientNoon)) + astraGradientNoonUp.z * 0.25)
variable.vec3.astraGradientNoonDown=vec3(astraSkyColorM.x * (0.9 + astraRainFactor * (-0.15 + 0 * astraGradientNoon)) + astraGradientNoonUp.x * 0.25, astraSkyColorM.y * (0.9 + astraRainFactor * (-0.3 + 0.02 * astraGradientNoon)) + astraGradientNoonUp.y * 0.25, astraSkyColorM.z * (0.9 + astraRainFactor * (-0.42 + 0.08 * astraGradientNoon)) + astraGradientNoonUp.z * 0.25)
variable.vec3.astraGradientSunsetUp=vec3(astraGradientColor2.x * (0.72 + 0.1 * astraRainFactor * astraRainFactor), astraGradientColor2.y * (0.522 + 0.2 * astraRainFactor * astraRainFactor), astraGradientColor2.z * (0.47 + 0.35 * astraRainFactor * astraRainFactor))
variable.vec3.astraGradientSunsetMiddle=vec3(astraGradientColor2.x * (1.8 + 0.15 * astraRainFactor * astraRainFactor), astraGradientColor2.y * (1.3 + 0.25 * astraRainFactor * astraRainFactor), astraGradientColor2.z * (1.2 + -0.05 * astraRainFactor * astraRainFactor))
uniform.vec3.astraSkySunsetDown=vec3(1.45 - 0.8 * astraRainFactor, 0.86 - 0.3 * astraRainFactor, 0.5 - 0 * astraRainFactor)
uniform.vec3.astraSkyDayUp=vec3(mix(astraGradientNoonUp.x, astraGradientSunsetUp.x, astraGradientInvNoon2), mix(astraGradientNoonUp.y, astraGradientSunsetUp.y, astraGradientInvNoon2), mix(astraGradientNoonUp.z, astraGradientSunsetUp.z, astraGradientInvNoon2))
uniform.vec3.astraSkyDayMiddle=vec3(mix(astraGradientNoonMiddle.x, astraGradientSunsetMiddle.x, astraGradientInvNoon2), mix(astraGradientNoonMiddle.y, astraGradientSunsetMiddle.y, astraGradientInvNoon2), mix(astraGradientNoonMiddle.z, astraGradientSunsetMiddle.z, astraGradientInvNoon2))
uniform.vec3.astraSkyDayDown=vec3(mix(astraGradientNoonDown.x, astraSkySunsetDown.x * 0.5 + 0.25 * astraGradientSunsetMiddle.x, astraGradientInvNoon2), mix(astraGradientNoonDown.y, astraSkySunsetDown.y * 0.5 + 0.25 * astraGradientSunsetMiddle.y, astraGradientInvNoon2), mix(astraGradientNoonDown.z, astraSkySunsetDown.z * 0.5 + 0.25 * astraGradientSunsetMiddle.z, astraGradientInvNoon2))
variable.vec3.astraGradientGlare=vec3(mix(0.38 * 0.3, 1.5 + 0 * astraGradientNoon, astraGradientVisibility) + isEyeInWater * astraGradientVisibility * 7.0, mix(0.4 * 0.3, 0.7 + 0.5 * astraGradientNoon, astraGradientVisibility) + isEyeInWater * astraGradientVisibility * 7.0, mix(0.5 * 0.3, 0.3 + 0.5 * astraGradientNoon, astraGradientVisibility) + isEyeInWater * astraGradientVisibility * 7.0)
variable.float.astraGradientGlareGrey=astraGradientGlare.x * 0.299 + astraGradientGlare.y * 0.587 + astraGradientGlare.z * 0.114
uniform.vec3.astraSkyGlareColor=vec3(mix(astraGradientGlare.x, astraGradientGlareGrey, 0.5 * astraRainFactor), mix(astraGradientGlare.y, astraGradientGlareGrey, 0.5 * astraRainFactor), mix(astraGradientGlare.z, astraGradientGlareGrey, 0.5 * astraRainFactor))
#if SKY_MODE == 0
variable.float.astraMiniDayT=clamp((worldSunVector.y + 0.16) / 0.24, 0.0, 1.0)
variable.float.astraMiniDay=astraMiniDayT * astraMiniDayT * (3.0 - 2.0 * astraMiniDayT)
variable.float.astraMiniSunY=max(worldSunVector.y, 0.01)
variable.float.astraMiniMoonY=max(-worldSunVector.y, 0.01)
variable.float.astraMiniSunInv=1.0 / max(sqrt(worldSunVector.x * worldSunVector.x + astraMiniSunY * astraMiniSunY + worldSunVector.z * worldSunVector.z), 0.000001)
variable.float.astraMiniMoonInv=1.0 / max(sqrt(worldSunVector.x * worldSunVector.x + astraMiniMoonY * astraMiniMoonY + worldSunVector.z * worldSunVector.z), 0.000001)
uniform.vec4.astraMinishitaSun=vec4(worldSunVector.x * astraMiniSunInv, astraMiniSunY * astraMiniSunInv, worldSunVector.z * astraMiniSunInv, 22.0 * mix(0.40, 1.0, sunProgress) * astraMiniDay)
uniform.vec4.astraMinishitaMoon=vec4(-worldSunVector.x * astraMiniMoonInv, astraMiniMoonY * astraMiniMoonInv, -worldSunVector.z * astraMiniMoonInv, (0.055 + 0.025 * moonProgress) * (1.0 - astraMiniDay))
#endif

# SUMMARY: frame-wide parameters, original Astra expressions.
# fmod is the properties expression language's floor modulus (not GLSL mod).
# Keep the finite-cycle centring and full-resolution scale used by taa_jitter.glsl.
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
