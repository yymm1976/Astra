# ============================================================
# Astra v1 - shaders.properties
# Iris-only shaderpack (design.md section 1.2: Iris features assumed present)
# Sections: buffer scales -> textures -> (Z2: GUI screens/profiles) -> (Z3: custom uniforms)
# ============================================================

# --- Buffer scales (formats are declared in shader sources) ---
# The shaft signal covers at most 128 blocks. The resolve upsamples four bilinear
# footprints with per-texel distance rejection, so half resolution carries it. The earlier
# conditional 1.0 made the air godray pass pay 4x whenever the shafts option was on
# (consolidated review B6 / F-12); underwater-only configurations below 7 march
# samples drop to quarter, which matches the reduced sampling budget
# (design.md survey 6 P0-1: the first size.buffer differential on the tier ladder).
# Both consumers derive their tap offsets from textureSize(): display.fsh and
# global/water/light_shafts.glsl.
# Buffer scales are pack-global; unused effect combinations keep only one texel.
#if defined GODRAYS && GODRAYS_STRENGTH > 0 && !defined VOLUMETRIC_FOG
size.buffer.colortex1=0.5 0.5
#elif defined UNDERWATER_LIGHT_SHAFTS && defined SHADOWS && UNDERWATER_SHAFT_STRENGTH > 0
#if UNDERWATER_SHAFT_SAMPLES < 7
size.buffer.colortex1=0.25 0.25
#else
size.buffer.colortex1=0.5 0.5
#endif
#else
size.buffer.colortex1=1 1
#endif
# Bloom capture. 0.5 -> 0.25: the capture is a blur source, so its resolution is not
# load-bearing, and the fragment count drops 4x (1080p: 518k -> 130k, each doing 13
# taps). global/post/bloom.glsl's BLOOM_CAPTURE_SCALE must match this value, and it
# widens the filter taps to compensate so the screen-space footprint is unchanged.
#if defined BLOOM && BLOOM_STRENGTH > 0
size.buffer.colortex2=0.25 0.25
#else
size.buffer.colortex2=1 1
#endif
# Iris TextureScaleOverride: integer strings are absolute pixels; 1.0 is relative.
size.buffer.colortex6=1 1
# Underwater bloom target at quarter resolution: a low-frequency blurred quantity.
# The full-resolution default made every frame pay a 1080p RGBA16 write for a pass
# that discards outright in air (consolidated review F1 / Hunyuan 12.2).
#if defined BLOOM && BLOOM_STRENGTH > 0
size.buffer.colortex7=0.25 0.25
#else
size.buffer.colortex7=1 1
#endif
size.buffer.colortex8=294 1
# Resolve the End disc at native dimensions so flow detail and silhouette edges
# are not softened by upsampling. Nether reuses it for receiver-space reflections;
# the End sky producer never runs there. Orbital data remains cached.
size.buffer.colortex9=1.0 1.0
# Auto-exposure history: one gain, so one texel (design.md SC-41). Unconditional on
# purpose - the gate is on the writing pass below, and a one-texel allocation is not worth
# a conditional in the buffer section.
size.buffer.colortex10=1 1
# Same-frame sky/cloud environment. Rough filtering uses a power-of-two sphere;
# the original single-level mode retains its two longitude gutters.
#if CLOUD_MODE == 1
#ifdef ROUGH_SKY_REFLECTIONS
size.buffer.colortex11=256 128
#else
size.buffer.colortex11=258 128
#endif
#else
size.buffer.colortex11=1 1
#endif
# Cloud history writes 24/25 directly; only the current-frame mode needs 12.
#if CLOUD_MODE != 1 || defined CLOUD_TEMPORAL
size.buffer.colortex12=1 1
#elif CLOUD_QUALITY == 0
size.buffer.colortex12=0.25 0.25
#elif CLOUD_QUALITY == 2
size.buffer.colortex12=1.0 1.0
#else
size.buffer.colortex12=0.5 0.5
#endif
# World-space cloud-plane transmission, separate from screen clouds and reflections.
#if CLOUD_MODE == 1
size.buffer.colortex14=256 256
#else
size.buffer.colortex14=1 1
#endif
# Temporal HDR resolve and separate persistent frame metadata (Iris 1.10.5+).
# colortex16 intentionally has NO size override while enabled: gbuffers writes it.
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
size.buffer.colortex15=1.0 1.0
size.buffer.colortex17=4 1
program.composite6.enabled=true
program.world-1/composite6.enabled=true
program.world1/composite6.enabled=true
program.composite7.enabled=true
program.world-1/composite7.enabled=true
program.world1/composite7.enabled=true
#else
size.buffer.colortex15=1 1
size.buffer.colortex16=1 1
size.buffer.colortex22=1 1
size.buffer.colortex17=1 1
program.composite6.enabled=false
program.world-1/composite6.enabled=false
program.world1/composite6.enabled=false
program.composite7.enabled=false
program.world-1/composite7.enabled=false
program.world1/composite7.enabled=false
#endif
# FXAA has its own display-space input; TAA displays resolved HDR directly in final.
#if ANTIALIASING == 1
size.buffer.colortex13=1.0 1.0
program.composite8.enabled=true
program.world-1/composite8.enabled=true
program.world1/composite8.enabled=true
#else
size.buffer.colortex13=1 1
program.composite8.enabled=false
program.world-1/composite8.enabled=false
program.world1/composite8.enabled=false
#endif
# Signed SH9 irradiance coefficients. The producer follows the reflection cache.
#if defined DIRECTIONAL_SKYLIGHT && DEBUG_VERTEX_AO == 0
size.buffer.colortex18=9 1
program.prepare3.enabled=true
#else
size.buffer.colortex18=1 1
program.prepare3.enabled=false
#endif
program.world-1/prepare3.enabled=false
program.world1/prepare3.enabled=false
# Ambient-only AO: gbuffers targets 19/20 stay at their default full size.
# R1 bent normal: colortex26 (half-res direction, same grid as 21) and colortex27
# (full-res re-evaluable sky response) exist only while DIRECTIONAL_SKYLIGHT
# rides along with the AO feature; either option alone keeps them at 1x1.
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
size.buffer.colortex21=0.5 0.5
#ifdef DIRECTIONAL_SKYLIGHT
size.buffer.colortex26=0.5 0.5
#else
size.buffer.colortex26=1 1
size.buffer.colortex27=1 1
#endif
#else
size.buffer.colortex19=1 1
size.buffer.colortex20=1 1
size.buffer.colortex21=1 1
size.buffer.colortex26=1 1
size.buffer.colortex27=1 1
#endif
program.world-1/deferred2.enabled=false
program.world1/deferred2.enabled=false
# Optional overworld volume S/T grid. Its pass follows screen clouds and AO;
# the deferred slot schedule below selects exactly one final scene composition.
#if defined VOLUMETRIC_FOG && VOLUME_FOG_DENSITY > 0
#if VOLUME_FOG_QUALITY == 0
size.buffer.colortex23=0.25 0.25
#else
size.buffer.colortex23=0.5 0.5
#endif
#else
size.buffer.colortex23=1 1
#endif
program.world-1/deferred1.enabled=false
# R6/T3 independent screen-cloud temporal history: resolved output + colour history
# (24) and per-texel representative metadata (25), both on the selected cloud
# grid. Properties and shader sources use the same exposed history option.
#if CLOUD_MODE == 1 && defined CLOUD_TEMPORAL
#if CLOUD_QUALITY == 0
size.buffer.colortex24=0.25 0.25
size.buffer.colortex25=0.25 0.25
#elif CLOUD_QUALITY == 2
size.buffer.colortex24=1.0 1.0
size.buffer.colortex25=1.0 1.0
#else
size.buffer.colortex24=0.5 0.5
size.buffer.colortex25=0.5 0.5
#endif
#else
size.buffer.colortex24=1 1
size.buffer.colortex25=1 1
#endif
# Independent rough-reflection normals/coverage; the colour history reuses 9.
# These are composite-only targets, independent of the scene AA setting.
#ifdef SCREENSPACE_REFLECTIONS
size.buffer.colortex28=1.0 1.0
#else
size.buffer.colortex28=1 1
#endif
#if defined UNDERWATER_LIGHT_SHAFTS && defined SHADOWS && UNDERWATER_SHAFT_STRENGTH > 0
#if defined GODRAYS && GODRAYS_STRENGTH > 0 && !defined VOLUMETRIC_FOG
# Keep both attachments of composite2 on the same grid as colortex1.
size.buffer.colortex29=0.5 0.5
#elif UNDERWATER_SHAFT_SAMPLES < 7
size.buffer.colortex29=0.25 0.25
#else
size.buffer.colortex29=0.5 0.5
#endif
#else
size.buffer.colortex29=1 1
#endif
size.buffer.colortex30=3 1
# Numeric comparisons belong to PropertiesPreprocessor. Iris's enabled-expression
# parser understands Boolean options only and treats an unknown `100>0` as true.
#if defined UNDERWATER_LIGHT_SHAFTS && defined SHADOWS && UNDERWATER_SHAFT_STRENGTH > 0
program.composite9.enabled=true
#else
program.composite9.enabled=false
#endif
program.world-1/composite9.enabled=SCREENSPACE_REFLECTIONS
program.world1/composite9.enabled=false
# Geometry (including opaque ice) consumes this after prepare has filled it.
#if CLOUD_MODE == 1
program.prepare.enabled=true
program.prepare2.enabled=true
#else
program.prepare.enabled=false
program.prepare2.enabled=false
#endif
program.world-1/prepare.enabled=false
program.world-1/prepare1.enabled=false
program.world1/prepare1.enabled=false
program.world-1/prepare2.enabled=false
program.world1/prepare2.enabled=false
program.world1/deferred1.enabled=true
program.world1/prepare.enabled=true

# Screen clouds run after opaque geometry. Occluded tiles can skip their march;
# the reflection environment stays in prepare for water/ice geometry consumers.
program.prepare1.enabled=false
# Slots: planar cloud -> optional AO -> optional volume -> scene composition.
# Without planar clouds, retain the original AO/volume/scene schedule.
#if CLOUD_MODE == 1
program.deferred1.enabled=true
#if (defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0) || (defined VOLUMETRIC_FOG && VOLUME_FOG_DENSITY > 0)
program.deferred2.enabled=true
#else
program.deferred2.enabled=false
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0 && defined VOLUMETRIC_FOG && VOLUME_FOG_DENSITY > 0
program.deferred3.enabled=true
#else
program.deferred3.enabled=false
#endif
#else
#if defined VOLUMETRIC_FOG && VOLUME_FOG_DENSITY > 0
program.deferred1.enabled=true
#else
program.deferred1.enabled=false
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
program.deferred2.enabled=true
#else
program.deferred2.enabled=false
#endif
program.deferred3.enabled=false
#endif
program.world-1/deferred3.enabled=false
program.world1/deferred3.enabled=false

# --- Pass enabling (design.md section 2.2 table; Z3 deliberately left these to the
#     pass owners - composite=B4, composite1=B5. deferred's condition belongs to E2.) ---
# E1/E2 routing (design 2.2/4.3); opaque copy precedes transparents.
particles.ordering=mixed
# AO is separated only while its Iris shadow prerequisite is available.
#ifdef SHADOWS
separateAo=true
shadow.enabled=true
#else
separateAo=false
shadow.enabled=false
#endif
#ifdef ENTITY_SHADOWS
shadowEntities=true
shadowPlayer=true
shadowBlockEntities=true
#else
shadowEntities=false
shadowPlayer=false
shadowBlockEntities=false
#endif
#if (defined GODRAYS && GODRAYS_STRENGTH > 0 && !defined VOLUMETRIC_FOG) || (defined UNDERWATER_LIGHT_SHAFTS && defined SHADOWS && UNDERWATER_SHAFT_STRENGTH > 0)
program.composite2.enabled=true
#else
program.composite2.enabled=false
#endif
#if defined BLOOM && BLOOM_STRENGTH > 0
program.composite1.enabled=true
# With Bloom, reuse the opaque snapshot after geometry for underwater composition.
program.composite3.enabled=true
program.composite4.enabled=true
#else
program.composite1.enabled=false
program.composite3.enabled=false
program.composite4.enabled=false
#endif
# Auto-exposure metering is gated by the option itself, and only in the overworld:
# nether/end carry a fixed per-dimension multiplier in global/post/grading.glsl instead,
# and program/final.fsh consumes the gain on its air arm only. Kept outside any #ifdef
# on purpose, like the gates below (check_pack #16 / survey P2-18).
program.composite5.enabled=AUTO_EXPOSURE
program.world-1/composite5.enabled=false
program.world1/composite5.enabled=false
program.world-1/composite3.enabled=false
program.world-1/composite4.enabled=false
program.world1/composite3.enabled=false
program.world1/composite4.enabled=false
# Water state also supplies terrain lighting/caustics when shafts are disabled.
program.composite.enabled=true
program.shadow.enabled=SHADOWS
# Iris 1.11.2: false selects distance-only caster culling, independent of camera frustum.
# Reflections, refracted rays and underwater light use casters outside that frustum.
shadow.culling=false
shadowTerrain=true
shadowTranslucent=true
# Blend overrides are pack-global in Iris 1.11.2: ShaderProperties looks them up with
# ProgramSource.getName(), which is the bare pass name, so a "blend.world-1/<pass>" key is
# stored under a name no program ever asks for. Per-dimension blending has to come from
# the shader sources instead (measured on iris-fabric-1.11.2+mc26.2, survey P2-18).
blend.shadow=off
blend.gbuffers_water.colortex5=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
program.world-1/composite.enabled=SCREENSPACE_REFLECTIONS
#if defined BLOOM && BLOOM_STRENGTH > 0
program.world-1/composite2.enabled=true
program.world1/composite1.enabled=true
#else
program.world-1/composite2.enabled=false
program.world1/composite1.enabled=false
#endif
program.world-1/composite1.enabled=SCREENSPACE_REFLECTIONS
#if defined SHADOWS && defined NETHER_VOXEL_LIGHT && BLOCKLIGHT_STRENGTH > 0
program.world-1/shadow.enabled=true
#else
program.world-1/shadow.enabled=false
#endif
program.world1/composite.enabled=false
program.world1/composite2.enabled=false
program.world1/shadow.enabled=SHADOWS
# Water propagation always needs the opaque scene before translucent composition.
program.deferred.enabled=true
program.world-1/deferred.enabled=true
program.world1/deferred.enabled=true
#if CLOUD_MODE != 0
# Suppress vanilla cloud geometry at submission; custom clouds already own the sky.
clouds=off
# Celestial radiance is accumulated over black, then added to visible sky in
# deferred. Vanilla cloud geometry keeps its original sky composition path.
blend.gbuffers_skytextured=SRC_ALPHA ONE ZERO ONE
#endif
#ifdef FANCY_TRANSLUCENTS
blend.gbuffers_water=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#else
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#endif
blend.gbuffers_terrain.colortex3=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_block.colortex3=off
blend.gbuffers_hand.colortex3=off
blend.gbuffers_textured_lit.colortex3=off
blend.gbuffers_particles.colortex3=off


# Reactive MRT is a classification, independent of colour alpha blending.
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
blend.gbuffers_armor_glint.colortex16=off
blend.gbuffers_basic.colortex16=off
blend.gbuffers_beaconbeam.colortex16=off
blend.gbuffers_block.colortex16=off
blend.gbuffers_block_translucent.colortex16=off
blend.gbuffers_damagedblock.colortex16=off
blend.gbuffers_entities.colortex16=off
blend.gbuffers_entities_translucent.colortex16=off
blend.gbuffers_hand.colortex16=off
blend.gbuffers_hand_water.colortex16=off
blend.gbuffers_particles_translucent.colortex16=off
blend.gbuffers_particles.colortex16=off
blend.gbuffers_spidereyes.colortex16=off
blend.gbuffers_terrain.colortex16=off
blend.gbuffers_textured.colortex16=off
blend.gbuffers_textured_lit.colortex16=off
blend.gbuffers_water.colortex16=off
blend.gbuffers_weather.colortex16=off
blend.gbuffers_clouds.colortex16=off
#endif


# Ambient and geometry metadata must not inherit colour alpha blending.
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_armor_glint.colortex19=off
blend.gbuffers_armor_glint.colortex20=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_basic.colortex19=off
blend.gbuffers_basic.colortex20=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_beaconbeam.colortex19=off
blend.gbuffers_beaconbeam.colortex20=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_block.colortex19=off
blend.gbuffers_block.colortex20=off
#endif
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
blend.gbuffers_block.colortex22=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_damagedblock.colortex19=off
blend.gbuffers_damagedblock.colortex20=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_entities.colortex19=off
blend.gbuffers_entities.colortex20=off
#endif
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
blend.gbuffers_entities.colortex22=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_hand.colortex19=off
blend.gbuffers_hand.colortex20=off
#endif
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
blend.gbuffers_hand.colortex22=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_spidereyes.colortex19=off
blend.gbuffers_spidereyes.colortex20=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_terrain.colortex19=off
blend.gbuffers_terrain.colortex20=off
#endif
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
blend.gbuffers_terrain.colortex22=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_textured.colortex19=off
blend.gbuffers_textured.colortex20=off
#endif
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_textured_lit.colortex19=off
blend.gbuffers_textured_lit.colortex20=off
#endif
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
blend.gbuffers_textured_lit.colortex22=off
#endif

# Dedicated opaque particle entry has the same metadata targets as textured_lit.
#if defined SCREENSPACE_AO && defined SHADOWS && AO_STRENGTH > 0 && DEBUG_VERTEX_AO == 0
blend.gbuffers_particles.colortex19=off
blend.gbuffers_particles.colortex20=off
#endif
#if ANTIALIASING == 2 && DEBUG_VERTEX_AO == 0
blend.gbuffers_particles.colortex22=off
#endif

# --- Custom textures ---
# Iris customTexture registers new sampler names in geometry, shadow and composite.
# texture.<stage>.<sampler> only overrides samplers already registered by Iris.
customTexture.steadfastWaterNoise=textures/steadfast-water-noise.png
customTexture.solasWaterNoise=textures/solas-water-noise.png
customTexture.astraEndTransfer=textures/astra-end-transfer.png
customTexture.astraEndTransferMeta=textures/astra-end-transfer-meta.png
customTexture.astraEndFlow=textures/astra-end-flow.png
customTexture.astraEndFlowMips=textures/astra-end-flow-mips.png

