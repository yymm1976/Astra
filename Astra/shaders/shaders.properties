# ------------------------------------------------------------
# CUSTOM UNIFORMS: CPU-precomputed parameters (Z3 base, design.md section 5 "CPU offload")
# Expression-level port from Steadfast 0.8.0 (GPLv3 + Section 7 additional terms)
# by coderbot - its shaders.properties CUSTOM UNIFORMS section. Per-entry borrow
# breakdown and the publish-gate rewrite requirement (design.md §9.3): THIRD-PARTY.md.
# "variable.*" = intermediates, "uniform.*" = values shipped to shaders.
# Every per-frame trig/pow that is view-independent is computed HERE, not in GLSL.
# ------------------------------------------------------------

# --- Light vectors (positions are length-100 vectors; no normalize() available here) ---
variable.vec3.sunVector=vec3( \
	sunPosition.x / 100.0, \
	sunPosition.y / 100.0, \
	sunPosition.z / 100.0)
uniform.vec3.lightVector=vec3( \
	shadowLightPosition.x / 100.0, \
	shadowLightPosition.y / 100.0, \
	shadowLightPosition.z / 100.0)

# World-space sun vector (always the SUN, independent of the shadow light which
# flips to the moon at night). gbufferModelViewInverse.Column.Row dot lightVector
# = M * v written out per-component (Iris matrix addressing, see Steadfast notes).
uniform.vec3.worldSunVector=vec3( \
	gbufferModelViewInverse.x.0 * sunVector.x \
		+ gbufferModelViewInverse.y.0 * sunVector.y \
		+ gbufferModelViewInverse.z.0 * sunVector.z, \
	gbufferModelViewInverse.x.1 * sunVector.x \
		+ gbufferModelViewInverse.y.1 * sunVector.y \
		+ gbufferModelViewInverse.z.1 * sunVector.z, \
	gbufferModelViewInverse.x.2 * sunVector.x \
		+ gbufferModelViewInverse.y.2 * sunVector.y \
		+ gbufferModelViewInverse.z.2 * sunVector.z)

# --- Day / sky factors (sky module D2, fog module B2) ---
# Ease-in-out progress of the sun above the horizon (0 at horizon, 1 at zenith)
uniform.float.sunProgress=1.0 - pow(1.0 - clamp(worldSunVector.y / 0.75, 0.0, 1.0), 2.0)
# Same for the moon (opposite direction)
uniform.float.moonProgress=1.0 - pow(1.0 - clamp(-worldSunVector.y / 0.75, 0.0, 1.0), 2.0)
# Horizon glow while the sun/moon crosses the horizon. The envelope spans solar
# elevation -9 .. +14 degrees; -4/+4 are the knee points, not the ends
# (consolidated review E10 / Qoder F-34).
variable.float.astraTwilightRise=clamp((worldSunVector.y + 0.156) / 0.086, 0.0, 1.0)
variable.float.astraTwilightFade=clamp((worldSunVector.y - 0.070) / 0.172, 0.0, 1.0)
variable.float.astraTwilightEnvelope=astraTwilightRise * astraTwilightRise * (3.0 - 2.0 * astraTwilightRise) * (1.0 - astraTwilightFade * astraTwilightFade * (3.0 - 2.0 * astraTwilightFade))
uniform.float.astraTwilightFactor=astraTwilightEnvelope * (1.0 - 0.7 * rainStrength)
# Fast collapse of skylight around dusk/dawn
uniform.float.skyVisibilityDay=pow(clamp(0.90 + worldSunVector.y / 0.15, 0.0, 1.0), 4.0)

# --- Moon phase scalars (survey P0-4; design.md section 5 CPU offload) ---
# These replace three per-fragment formulas that read the built-in moonPhase. The move
# also repairs a dead feature: WorldTimeUniforms registers moonPhase with uniform1i
# (measured on iris-fabric-1.11.2+mc26.2), so the pack's "uniform float moonPhase" was a
# type mismatch, and ProgramUniforms.buildUniforms logs "Wrong uniform type for <name>:
# Iris is providing int but the program expects float. Disabling that uniform." and drops
# the binding - the phase was pinned at 0, i.e. a full moon every night. The expression
# language reads the Java-side value instead of a GL uniform, so no type is involved.
# 0 is full and 4 is new, the vanilla moon_phases order - inherited from the GLSL these lines came
# out of and never checked in game (it could not be, while the binding was disabled); regression
# checklist row 7b is what settles it. The ternary has to be if(), the ?: operator never resolves
# (survey P0-4 note).
uniform.float.astraMoonIllumination=0.5 + 0.5 * cos(6.2831853 * moonPhase / 8.0)
uniform.float.astraMoonLimbSign=if(moonPhase < 4.0, 1.0, -1.0)
# Mirror the waxing half of the eight-phase cycle around the new moon.
uniform.float.astraMoonLightScale=mix(0.82, 1.06, clamp(abs(moonPhase - 4.0) * 0.25, 0.0, 1.0))

# --- E1 original CPU values; C1 consumes one intensity/suppression contract. ---
# (Iris evaluates custom uniforms top-down, so this block must sit after worldSunVector
# / skyVisibilityDay; rainStrength / heldBlockLightValue are Iris built-ins.)
uniform.float.astraHeldLightBase=clamp(max(heldBlockLightValue, heldBlockLightValue2) / 15.0, 0.0, 1.0)
uniform.float.astraBlocklightSuppression=0.75 * skyVisibilityDay * (1.0 - 0.5 * rainStrength)
uniform.float.astraHeldLightSuppression=clamp(eyeBrightnessSmooth.y / 240.0, 0.0, 1.0)

# --- Fog (FogV2 family, module B2; design.md section 4.2) ---
uniform.float.borderFogDistance=far
# pow(d,3) atmospheric fog coefficient: distance normalization + long-range boost,
# all precomputed here (design.md section 5). FOG_DENSITY option is applied as a
# compile-time multiplier in-shader.
variable.float.renderDistanceFogTweak=1.0 + 0.01 * max(0.0, borderFogDistance - 200.0)
uniform.float.atmosphereFogCoefficient=renderDistanceFogTweak * pow(0.60 / borderFogDistance, 3.0)
# Day/night ramp of underwater fog (transition within ~0.3 degrees of the horizon)
uniform.float.dayUnderwaterFogFade=pow(clamp(0.90 + worldSunVector.y / 0.05, 0.0, 1.0), 4.0)

# --- Wind (foliage sway, module B3; design.md section 4.1) ---
# Complementary's active wave uses three time-only sines. Store these exact
# current phases in the TAA state so the historical evaluator uses the same frame.
#ifdef WAVING_FOLIAGE
variable.float.astraFoliageWindTime=frameTimeCounter * 170.0
uniform.vec3.astraFoliageWindPhases=vec3( \
	sin(astraFoliageWindTime * 0.0127), \
	sin(astraFoliageWindTime * 0.0089), \
	sin(astraFoliageWindTime * 0.0114))
#endif

# --- Godrays exposure (module B4; design.md section 4.4 - all three fades CPU-side) ---
# Forward direction in view space is always -Z
variable.float.LdotF=-lightVector.z
variable.float.godraysMaxAngle=0.5
# View-angle fade: gone at 60 degrees off the light
variable.float.godraysViewAngleFade=pow(clamp((LdotF - godraysMaxAngle) / (1.0 - godraysMaxAngle), 0.0, 1.0), 2.0)
# Off-screen fade: protects against flicker when zooming past the light position
variable.vec4.clipLightVector=vec4( \
	gbufferProjection.x.0 * lightVector.x \
		+ gbufferProjection.y.0 * lightVector.y \
		+ gbufferProjection.z.0 * lightVector.z, \
	gbufferProjection.x.1 * lightVector.x \
		+ gbufferProjection.y.1 * lightVector.y \
		+ gbufferProjection.z.1 * lightVector.z, \
	gbufferProjection.x.2 * lightVector.x \
		+ gbufferProjection.y.2 * lightVector.y \
		+ gbufferProjection.z.2 * lightVector.z, \
	gbufferProjection.x.3 * lightVector.x \
		+ gbufferProjection.y.3 * lightVector.y \
		+ gbufferProjection.z.3 * lightVector.z)
variable.vec3.ndcLightVector=vec3( \
	clipLightVector.x / max(abs(clipLightVector.w), 0.0001), \
	clipLightVector.y / max(abs(clipLightVector.w), 0.0001), \
	clipLightVector.z / max(abs(clipLightVector.w), 0.0001))
variable.float.godraysOffscreenFade=if(clipLightVector.w > 0.0, \
	clamp((1.0 - max(abs(ndcLightVector.x), abs(ndcLightVector.y))) / 0.1, 0.0, 1.0), \
	0.0)
# Time-of-day exposure: weaker at noon, stronger at dawn/dusk and night
variable.float.godraysDayExposureMorning=0.24
variable.float.godraysDayExposureNoon=0.10
variable.float.godraysNightExposure=0.16
variable.float.godraysBaseExposure=if(worldSunVector.y > 0.0, \
	mix(godraysDayExposureMorning, godraysDayExposureNoon, sunProgress), \
	godraysNightExposure)
uniform.float.godraysExposure=godraysBaseExposure * godraysViewAngleFade * godraysOffscreenFade

# --- Biome tint (module B2 air-perspective/biome tint; design.md section 4.2) ---
# The temporally smoothed temperature/humidity uniforms were removed: they had no
# shader consumer and the biome tint resolves from fogColor directly
# (consolidated review E2 / Qoder F-28).

# Solas V2.2b custom time expressions, prefixed for the water lighting adapter.
variable.float.astraSolasTAmin=frac(sunAngle - 0.033333333)
variable.float.astraSolasTAlin=if(astraSolasTAmin < 0.433333333, astraSolasTAmin * 1.15384615385, astraSolasTAmin * 0.882352941176 + 0.117647058824)
variable.float.astraSolasHA=if(astraSolasTAlin > 0.5, 1.0, 0.0)
variable.float.astraSolasTAfrc=frac(astraSolasTAlin * 2.0)
variable.float.astraSolasTAfrs=astraSolasTAfrc * astraSolasTAfrc * (3.0 - 2.0 * astraSolasTAfrc)
variable.float.astraSolasTAmix=if(astraSolasHA < 0.5, 0.3, -0.1)
uniform.float.astraSolasTimeAngle=(astraSolasTAfrc * (1.0 - astraSolasTAmix) + astraSolasTAfrs * astraSolasTAmix + astraSolasHA) * 0.5
uniform.float.astraSolasTimeBrightness=max(sin(astraSolasTimeAngle * 6.28318530718), 0.0)
uniform.float.astraSolasShadowFade=clamp(1.0 - (abs(abs(sunAngle - 0.5) - 0.25) - 0.23) * 100.0, 0.0, 1.0)

# Rain builds gradually; visible puddles and impacts clear promptly after rain.
uniform.float.astraRainFactor=smooth(71, rainStrength, 3, 0.8)

# Batch 2 / UShader idea only: detect clock jumps once on the CPU.
# Circular coordinates stay continuous across tick 23999 -> 0, and do not depend
# on sunPathRotation or the sun/moon shadow-source handoff. IDs 85/86 are distinct
# from the existing rain and biome smoothers. A small lag tolerates normal ticks.
variable.float.astraClockAngle=worldTime * 0.000261799387799
variable.float.astraClockSin=sin(astraClockAngle)
variable.float.astraClockCos=cos(astraClockAngle)
# Iris SmoothFloat converts this parameter to seconds with * 0.1; 20 * dt
# therefore retains about two frames of lag, rather than following a jump instantly.
variable.float.astraClockHalfLife=max(0.01, min(frameTime, 0.25) * 20.0)
variable.float.astraClockLagSin=smooth(85, astraClockSin, astraClockHalfLife, astraClockHalfLife)
variable.float.astraClockLagCos=smooth(86, astraClockCos, astraClockHalfLife, astraClockHalfLife)
uniform.int.astraTimeDiscontinuity=if(abs(astraClockSin - astraClockLagSin) + abs(astraClockCos - astraClockLagCos) > 0.02, 1, 0)

# View-independent sky/cloud palette terms. Keep raw rainStrength for daytime
# sky desaturation and smoothed astraRainFactor for the night palette, as in GLSL.
variable.float.astraSkyDrySquared=(1.0 - rainStrength) * (1.0 - rainStrength)
variable.vec3.astraSkyRoot=vec3(sqrt(max(skyColor.r, 0.0)), sqrt(max(skyColor.g, 0.0)), sqrt(max(skyColor.b, 0.0)))
uniform.vec3.astraSkyColorM=vec3(mix(max(astraSkyRoot.x, 0.63), astraSkyRoot.x, astraSkyDrySquared), mix(max(astraSkyRoot.y, 0.67), astraSkyRoot.y, astraSkyDrySquared), mix(max(astraSkyRoot.z, 0.73), astraSkyRoot.z, astraSkyDrySquared))
uniform.vec3.astraSkyNoonBase=vec3(pow(astraSkyColorM.x, 2.9), pow(astraSkyColorM.y, 2.9), pow(astraSkyColorM.z, 2.9))
variable.float.astraSkyNightWeather=1.0 - 0.5 * astraRainFactor
uniform.vec3.astraSkyNightUp=vec3(pow(0.063 * astraSkyNightWeather + max(skyColor.r, 0.0), 0.90) * 0.45, pow(0.126 * astraSkyNightWeather + max(skyColor.g, 0.0), 0.90) * 0.45, pow(0.216 * astraSkyNightWeather + max(skyColor.b, 0.0), 0.90) * 0.45)
uniform.vec3.astraSkyNightMiddle=vec3(sqrt(astraSkyNightUp.x) * 0.65, sqrt(astraSkyNightUp.y) * 0.65, sqrt(astraSkyNightUp.z) * 0.65)
uniform.vec3.astraCloudNoonAmbient=vec3(pow(max(skyColor.r, 0.0), 0.75) * 0.85, pow(max(skyColor.g, 0.0), 0.75) * 0.85, pow(max(skyColor.b, 0.0), 0.75) * 0.85)

# Overworld surface/fog palettes depend only on frame lighting, not the pixel.
# Match the original GLSL smoothstep curves with clamp + cubic interpolation.
# mix is scalar in Iris expressions, so RGB channels are written separately.
variable.float.astraAmbientDayT=clamp((worldSunVector.y + 0.20) / 0.28, 0.0, 1.0)
variable.float.astraAmbientDayBlend=astraAmbientDayT * astraAmbientDayT * (3.0 - 2.0 * astraAmbientDayT)
variable.float.astraAmbientMorningT=clamp((worldSunVector.y + 0.14) / 0.20, 0.0, 1.0)
variable.float.astraAmbientMorningBlend=astraAmbientMorningT * astraAmbientMorningT * (3.0 - 2.0 * astraAmbientMorningT)
variable.vec3.astraAmbientDay=vec3(mix(0.28, 0.36, sunProgress), mix(0.30, 0.43, sunProgress), mix(0.35, 0.57, sunProgress))
variable.vec3.astraAmbientNight=vec3(mix(0.050, 0.083, moonProgress), mix(0.063, 0.106, moonProgress), mix(0.086, 0.148, moonProgress))
variable.vec3.astraAmbientRaw=vec3( \
    mix(mix(astraAmbientNight.x, astraAmbientDay.x, astraAmbientDayBlend), mix(0.13, 0.29, astraAmbientMorningBlend), astraTwilightFactor), \
    mix(mix(astraAmbientNight.y, astraAmbientDay.y, astraAmbientDayBlend), mix(0.14, 0.25, astraAmbientMorningBlend), astraTwilightFactor), \
    mix(mix(astraAmbientNight.z, astraAmbientDay.z, astraAmbientDayBlend), mix(0.18, 0.255, astraAmbientMorningBlend), astraTwilightFactor))
variable.float.astraAmbientRainGrey=(astraAmbientRaw.x * 0.25 + astraAmbientRaw.y * 0.65 + astraAmbientRaw.z * 0.10) * 0.78
uniform.vec3.astraAmbientPalette=vec3(mix(astraAmbientRaw.x, astraAmbientRainGrey, rainStrength * 0.55), mix(astraAmbientRaw.y, astraAmbientRainGrey, rainStrength * 0.55), mix(astraAmbientRaw.z, astraAmbientRainGrey, rainStrength * 0.55))
variable.float.astraSunWarmT=clamp((worldSunVector.y - 0.06) / 0.42, 0.0, 1.0)
variable.float.astraSunWarmBlend=astraSunWarmT * astraSunWarmT * (3.0 - 2.0 * astraSunWarmT)
uniform.vec3.astraSunPalette=vec3( \
    mix(mix(0.92, 1.10, sunProgress), mix(2.20, 1.55, astraSunWarmBlend), astraTwilightFactor), \
    mix(mix(0.81, 0.99, sunProgress), mix(0.72, 0.87, astraSunWarmBlend), astraTwilightFactor), \
    mix(mix(0.65, 0.83, sunProgress), mix(0.18, 0.40, astraSunWarmBlend), astraTwilightFactor))
uniform.vec3.astraMoonPalette=vec3(mix(0.30, 0.42, moonProgress), mix(0.30, 0.42, moonProgress), mix(0.48, 0.67, moonProgress))
customTexture.complementaryCloudNoise=textures/complementary-cloud-water.png

# Nether biome palette, Complementary r5.9 mode 3.
uniform.float.astraNetherWastes=smooth(80, if(in(biome, BIOME_NETHER_WASTES), 1, 0), 8, 8)
uniform.float.astraNetherCrimson=smooth(81, if(in(biome, BIOME_CRIMSON_FOREST), 1, 0), 8, 8)
uniform.float.astraNetherWarped=smooth(82, if(in(biome, BIOME_WARPED_FOREST), 1, 0), 8, 8)
uniform.float.astraNetherBasalt=smooth(83, if(in(biome, BIOME_BASALT_DELTAS), 1, 0), 8, 8)
uniform.float.astraNetherSoul=smooth(84, if(in(biome, BIOME_SOUL_SAND_VALLEY), 1, 0), 8, 8)

# The legacy nether_volume.glsl module is inactive; no active pass samples its noise.

# Rain impact ripples. Ported from IterationT 3.2 RippleAnimation1/2.png: each sheet is
# a 128x7680 stack of sixty 128x128 frames, and the shader plays it by scrolling V in
# sixty discrete steps, so no .mcmeta animation section is involved. Layer 1 is used by
# light rain; layer 2 fades in as the downfall mask deepens. (The former third sheet
# was registered but never sampled - consolidated review E9 / Qoder F-29 - and is gone.)
customTexture.astraRipple1=textures/astra-ripple-1.png
customTexture.astraRipple2=textures/astra-ripple-2.png

# Nether spatial light (NETHER_VOXEL_LIGHT): a nine-step compute chain over a 64^3 volume
# centred on the player, plus the three volumes it works on - one occupancy image and two
# same-frame propagation images.
#
# The nine stages have to be switched off from here rather than from inside the shader:
# program/nether_light.csh guards nothing on NETHER_VOXEL_LIGHT, so an un-gated stage
# compiles, dispatches 512 work groups per step and stores into image units nothing
# configured, while the option is off and no shader samples the result.
# Iris indexes the chain as the bare name plus one upper-case letter (shadowcomp,
# shadowcompA .. shadowcompZ); a numbered suffix would never be loaded at all.
#
# Two parser facts decided this form (measured on iris-fabric-1.11.2+mc26.2, survey
# P2-18). program.* is the only directive family that accepts a dimension namespace, and
# the name Iris compares carries the world folder - so the keys read
# "program.world-1/shadowcompX", and the "compute.world-1/shadowcompX.enabled" spelling
# used here before was parsed by no handler and was silently dead. Both preprocessor
# branches emit every key explicitly: omitting a disabled key would leave the stage on.
# Zero block-light strength also disables capture, propagation and images; the
# receiver then has no voxel contribution. Handheld and material emission stay separate.
#if defined SHADOWS && defined NETHER_VOXEL_LIGHT && BLOCKLIGHT_STRENGTH > 0
program.world-1/shadowcomp.enabled=true
program.world-1/shadowcompA.enabled=true
program.world-1/shadowcompB.enabled=true
program.world-1/shadowcompC.enabled=true
program.world-1/shadowcompD.enabled=true
program.world-1/shadowcompE.enabled=true
program.world-1/shadowcompF.enabled=true
program.world-1/shadowcompG.enabled=true
program.world-1/shadowcompH.enabled=true
#else
program.world-1/shadowcomp.enabled=false
program.world-1/shadowcompA.enabled=false
program.world-1/shadowcompB.enabled=false
program.world-1/shadowcompC.enabled=false
program.world-1/shadowcompD.enabled=false
program.world-1/shadowcompE.enabled=false
program.world-1/shadowcompF.enabled=false
program.world-1/shadowcompG.enabled=false
program.world-1/shadowcompH.enabled=false
#endif
# Iris rejects a pack that declares image directives without a CUSTOM_IMAGES feature
# flag, so the declarations live behind the same option as the code that uses them.
# "optional" (not "required") keeps the pack loadable if a build ever lacks the feature -
# then the option is simply unusable instead of the whole pack being rejected.
# 3 images total; Iris 1.11.2 caps custom images at 15.
#if defined NETHER_VOXEL_LIGHT && defined SHADOWS && BLOCKLIGHT_STRENGTH > 0
uniform.vec2.astraNetherEmissionPulse=vec2(0.96 + 0.04 * sin(frameTimeCounter * 2.1), 0.97 + 0.03 * sin(frameTimeCounter * 1.7))
iris.features.optional=CUSTOM_IMAGES COMPUTE_SHADERS
image.astraVoxelImage=astraVoxelSampler red_integer r32ui unsigned_int true false 64 64 64
image.astraLightA=astraLightSamplerA rgba rgba16f half_float false false 64 64 64
image.astraLightB=astraLightSamplerB rgba rgba16f half_float false false 64 64 64
#endif


