# ============================================================
# Astra v1 - shaders.properties
# Iris-only shaderpack (design.md section 1.2: Iris features assumed present)
# Sections: buffer scales -> textures -> (Z2: GUI screens/profiles) -> (Z3: custom uniforms)
# ============================================================

# --- Buffer scales (formats are declared in shader sources) ---
# Half resolution for both the air godrays and the underwater shaft march. The shaft
# signal is a low-frequency 40-block volume and the resolve already upsamples with a
# distance-weighted 4-tap kernel; the earlier conditional 1.0 made the air godray pass
# pay 4x whenever the shafts option was on (consolidated review B6 / F-12).
# Known limitation: nether/end allocate this buffer at the same size even though their
# composite2 is disabled - it is written and read nowhere in those dimensions.
size.buffer.colortex1=0.5 0.5
# Bloom capture. 0.5 -> 0.25: the capture is a blur source, so its resolution is not
# load-bearing, and the fragment count drops 4x (1080p: 518k -> 130k, each doing 13
# taps). global/post/bloom.glsl's BLOOM_CAPTURE_SCALE must match this value, and it
# widens the filter taps to compensate so the screen-space footprint is unchanged.
size.buffer.colortex2=0.25 0.25
# Iris TextureScaleOverride: integer strings are absolute pixels; 1.0 is relative.
size.buffer.colortex6=1 1
# Underwater bloom target at quarter resolution: a low-frequency blurred quantity.
# The full-resolution default made every frame pay a 1080p RGBA16 write for a pass
# that discards outright in air (consolidated review F1 / Hunyuan 12.2).
size.buffer.colortex7=0.25 0.25
size.buffer.colortex8=294 1
# Resolve disc detail at three-quarter dimensions; orbital data remains cached.
size.buffer.colortex9=0.75 0.75
program.world1/deferred1.enabled=true
program.world1/prepare.enabled=true

# --- Pass enabling (design.md section 2.2 table; Z3 deliberately left these to the
#     pass owners - composite=B4, composite1=B5. deferred's condition belongs to E2.) ---
# E1/E2 routing (design 2.2/4.3); opaque copy precedes transparents.
particles.ordering=mixed
shadowEntities=true
shadowBlockEntities=true
#if defined GODRAYS || (defined UNDERWATER_LIGHT_SHAFTS && defined SHADOWS && UNDERWATER_SHAFT_STRENGTH > 0)
program.composite2.enabled=true
#else
program.composite2.enabled=false
#endif
program.composite1.enabled=BLOOM
program.composite3.enabled=true
program.composite4.enabled=BLOOM
program.world-1/composite3.enabled=false
program.world-1/composite4.enabled=false
program.world1/composite3.enabled=false
program.world1/composite4.enabled=false
# Water state also supplies terrain lighting/caustics when shafts are disabled.
program.composite.enabled=true
program.shadow.enabled=SHADOWS
# Iris 1.11.2: false selects distance-only caster culling, independent of camera frustum.
# Reflections, refracted rays and underwater light use casters outside that frustum.
shadow.culling=false
shadowTerrain=true
shadowTranslucent=true
blend.shadow=off
blend.gbuffers_water.colortex5=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world-1/gbuffers_water.colortex5=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.world1/gbuffers_water.colortex5=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
program.world-1/composite.enabled=false
program.world-1/composite2.enabled=false
program.world-1/composite1.enabled=BLOOM
program.world-1/shadow.enabled=NETHER_VOXEL_LIGHT
blend.world-1/shadow=off
program.world1/composite.enabled=false
program.world1/composite2.enabled=false
program.world1/composite1.enabled=BLOOM
program.world1/shadow.enabled=SHADOWS
blend.world1/shadow=off
# Water propagation always needs the opaque scene before translucent composition.
program.deferred.enabled=true
program.world-1/deferred.enabled=true
program.world1/deferred.enabled=true
