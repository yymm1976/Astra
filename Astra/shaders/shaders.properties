variable.float.astraWaterPaletteLinearG=if(astraWaterPaletteSunG <= 0.04045, astraWaterPaletteSunG / 12.92, pow((astraWaterPaletteSunG + 0.055) / 1.055, 2.2))
variable.float.astraWaterPaletteLinearB=if(astraWaterPaletteSunB <= 0.04045, astraWaterPaletteSunB / 12.92, pow((astraWaterPaletteSunB + 0.055) / 1.055, 2.2))
variable.float.astraWaterPaletteSunInv=1.0 / sqrt(astraWaterPaletteLinearR * astraWaterPaletteLinearR + astraWaterPaletteLinearG * astraWaterPaletteLinearG + astraWaterPaletteLinearB * astraWaterPaletteLinearB)
