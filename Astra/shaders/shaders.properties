variable.float.astraWaterPaletteDaySquared=astraWaterPaletteDay * astraWaterPaletteDay
variable.float.astraWaterPaletteAmbientIntensity=mix(0.6, mix(0.9, 1.2, astraWaterPaletteTime), astraWaterPaletteDaySquared)
variable.float.astraWaterPaletteNightR=if(clamp(1.292936186 * pow(57.5, -0.133204759), 0.0, 1.0) <= 0.04045, clamp(1.292936186 * pow(57.5, -0.133204759), 0.0, 1.0) / 12.92, pow((clamp(1.292936186 * pow(57.5, -0.133204759), 0.0, 1.0) + 0.055) / 1.055, 2.2)) * 0.3
