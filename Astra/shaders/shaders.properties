screen.DAWN_COLORS=TINT_SKY_DAWN_TOP_R TINT_SKY_DAWN_TOP_G TINT_SKY_DAWN_TOP_B <empty> <empty> <empty> TINT_SKY_DAWN_HORIZON_R TINT_SKY_DAWN_HORIZON_G TINT_SKY_DAWN_HORIZON_B
