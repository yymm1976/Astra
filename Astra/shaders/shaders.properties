# ------------------------------------------------------------
# Profiles (design.md 3.3): complete explicit configuration each;
# raw defaults above = BALANCED (the 4050 baseline default profile)
#
# Tiering rule (survey docs/2026-09-20 6 P0-1): PERFORMANCE <= BALANCED <= ULTRA in
# measured cost, and every token that differs between tiers must change cost or select a
# richer implementation - SSS_FOLIAGE / WATER_CAUSTICS / AIR_PERSPECTIVE / WAVING_FOLIAGE
# / UNDERWATER_SHAFT_SAMPLES / SKY_MODE / SUN_MOON_MODE each guard real work (see
# qa/tools/inspect_iris_properties.py for the resolved per-tier pass and buffer sets).
# Differing a token purely to make the tiers look different is the RedHat failure mode
# the survey cites: a non-monotone ladder that is decoupled from cost.
# BALANCED stays byte-identical to the lib/settings.glsl raw defaults - that equality is
# the benchmark anchor and the shipping default, so tier work never touches it.
# ------------------------------------------------------------
profile.PERFORMANCE=SUNLIGHT_STRENGTH=100 MOONLIGHT_STRENGTH=100 SKYLIGHT_STRENGTH=100 MIN_AMBIENT=8 BLOCKLIGHT_STRENGTH=100 BLOCKLIGHT_SUPPRESSION HANDHELD_LIGHTING HANDHELD_LIGHT_STRENGTH=100 LIGHTNING_FLASH EMISSIVE_STRENGTH=100 SHADOWS SHADOW_RESOLUTION=1024 SHADOW_DISTANCE=192 ENTITY_SHADOW_DISTANCE=48 SHADOW_SOFTNESS=2 COLORED_SHADOWS STATIC_SHADOW_FALLBACK !SSS_FOLIAGE SSS_STRENGTH=60 SKY_MODE=1 SUN_MOON_MODE=0 STARS CLOUD_MODE=0 CLOUD_COVERAGE=50 !CLOUD_SHADOWS !AIR_PERSPECTIVE BIOME_TINT BIOME_TINT_STRENGTH=50 END_NEBULA WATER_WAVES WATER_WAVE_HEIGHT=100 WATER_WAVE_SPEED=100 !SCREENSPACE_REFLECTIONS !SCREENSPACE_REFRACTION REFRACTION_STRENGTH=100 WATER_ABSORPTION=100 WATER_CHARACTER=1 !WATER_CAUSTICS !UNDERWATER_PARTICLES !FANCY_TRANSLUCENTS FOG_DENSITY=50 SKY_FOG_STRENGTH=15 BORDER_FOG CAVE_FOG UNDERWATER_FOG_DENSITY=40 NETHER_FOG_DENSITY=70 END_FOG_DENSITY=100 !NETHER_VOXEL_LIGHT TONEMAP_OPERATOR=0 EXPOSURE=100 !AUTO_EXPOSURE SATURATION=100 VIBRANCE=100 CONTRAST=102 COLOR_TEMPERATURE=0 !BLOOM BLOOM_STRENGTH=100 !GODRAYS GODRAYS_STRENGTH=100 !GODRAYS_SUN_OCCLUSION DITHERING !VIGNETTE !WAVING_FOLIAGE WAVING_FOLIAGE_STRENGTH=100 !VOXY_SUPPORT UNDERWATER_LIGHT_SHAFTS UNDERWATER_SHAFT_STRENGTH=100 UNDERWATER_SHAFT_SAMPLES=4 !UNDERWATER_SHAFT_CALIBRATION END_PRECESSION_MINUTES=28 SHADOW_FILTER_MODE=0
